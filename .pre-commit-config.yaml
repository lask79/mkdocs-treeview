repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format
        types: [python]

      - id: ruff-check
        name: ruff lint
        language: system
        entry: uv run ruff check --fix
        types: [python]

      - id: mypy
        name: mypy
        language: system
        entry: uv run mypy mkdocs_treeview/
        pass_filenames: false

      - id: pytest-unit
        name: unit tests
        language: system
        entry: uv run pytest tests/unit/ -q
        pass_filenames: false
